name: Check private dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: "false"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Install synthetic-media generator
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Start local frontend
        run: |
          npm run dev > /tmp/twib-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/twib-vite.log
          exit 1
      - run: npm run test:browser
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            /tmp/twib-vite.log
            test-results/
          if-no-files-found: ignore
          retention-days: 3
