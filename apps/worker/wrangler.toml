name = "twib-clip-dashboard"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
[vars]
APP_ENV = "production"
# Configure APP_ORIGIN, ACCESS_TEAM_DOMAIN, ACCESS_AUD, OWNER_EMAIL only after access approval.
[[d1_databases]]
binding = "DB"
database_name = "twib-review"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[env.local.vars]
APP_ENV = "local"
LOCAL_DEMO = "true"
APP_ORIGIN = "http://localhost:5173"
[[env.local.d1_databases]]
binding = "DB"
database_name = "twib-review-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
